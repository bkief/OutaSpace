name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag Name (e.g. v1.0.0)"
        required: true
        type: string
      release_name:
        description: "Release Title (optional, defaults to tag name)"
        required: false
        type: string
        default: ""
      release_notes:
        description: "Release Notes / Description (optional)"
        required: false
        type: string
        default: ""
      draft:
        description: "Create as draft"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Create as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Artifacts (EXE & MSIX)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Windows Executable
        shell: pwsh
        run: |
          wails build -platform windows/amd64

      - name: Build Windows MSIX Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "build\bin\OutaSpace.exe" -Destination "dist\OutaSpace-windows-amd64.exe"
          powershell -ExecutionPolicy Bypass -File build\windows\msix\generate-msix.ps1 -Version "${{ inputs.tag_name }}" -OutputDir "dist"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS Artifact (DMG)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS Universal App
        run: |
          wails build -platform darwin/universal

      - name: Package DMG
        run: |
          brew install create-dmg || true
          mkdir -p dist

          if command -v create-dmg > /dev/null; then
            create-dmg \
              --volname "OutaSpace" \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 100 \
              --icon "OutaSpace.app" 175 190 \
              --hide-extension "OutaSpace.app" \
              --app-drop-link 425 190 \
              "dist/OutaSpace-darwin-universal.dmg" \
              "build/bin/OutaSpace.app" || hdiutil create -volname "OutaSpace" -srcfolder "build/bin/OutaSpace.app" -ov -format UDZO "dist/OutaSpace-darwin-universal.dmg"
          else
            hdiutil create -volname "OutaSpace" -srcfolder "build/bin/OutaSpace.app" -ov -format UDZO "dist/OutaSpace-darwin-universal.dmg"
          fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/*
          if-no-files-found: error

  release:
    name: Release & Package (GoReleaser, DEB, RPM)
    runs-on: ubuntu-22.04
    needs: [build-windows, build-macos]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            libgtk-3-dev libwebkit2gtk-4.0-dev file

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Linux Binary with Wails
        run: |
          if pkg-config --exists webkit2gtk-4.0; then
            wails build -platform linux/amd64
          else
            wails build -platform linux/amd64 -tags webkit2_41
          fi

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: extra-files

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: extra-files

      - name: Set Release Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.tag_name }}" -m "Release ${{ inputs.tag_name }}" || true

      - name: Run GoReleaser (Package DEB, RPM, & Publish Release)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag_name }}
