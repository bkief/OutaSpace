<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>OutaSpace - Visual Disk Space Analyzer</title>
    <link rel="stylesheet" href="./main.css"/>
</head>
<body class="dark-theme">
    <!-- Floating Start / Splash UI -->
    <div id="ui-layer">
        <img src="./assets/logo.png" class="splash-logo" alt="OutaSpace Logo"/>
        <h1>OutaSpace</h1>
        <p class="subtitle">Real-time disk space rain & interactive treemap visualizer</p>
        
        <div class="control-row">
            <span class="control-label">Scan Speed</span>
            <div class="segmented-control" id="speed-segmented">
                <button type="button" class="seg-btn" data-value="slow">Slow</button>
                <button type="button" class="seg-btn active" data-value="medium">Medium</button>
                <button type="button" class="seg-btn" data-value="fast">Fast</button>
            </div>
            <input type="hidden" id="speed-select" value="medium"/>
        </div>

        <div class="action-buttons">
            <button id="scan-btn" class="btn btn-primary">Select Directory to Scan</button>
            <button id="results-btn" class="btn btn-accent" style="display: none;">📊 View Results</button>
        </div>
        <p id="status-text"></p>
    </div>

    <!-- Fullscreen Rain Canvas Background -->
    <canvas id="canvas"></canvas>

    <!-- Results Dashboard Overlay -->
    <div id="treemap-container">
        <!-- Top Toolbar & Breadcrumb -->
        <header class="wds-header">
            <div class="wds-nav">
                <div class="wds-brand">
                    <img src="./assets/logo.png" class="wds-logo" alt="OutaSpace Logo"/>
                    <span class="wds-brand-title">OutaSpace</span>
                </div>
                <button id="wds-up-btn" class="wds-btn" title="Go up one directory">⬆ Up</button>
                <div id="wds-breadcrumbs" class="wds-breadcrumbs"></div>
            </div>
            <div class="wds-stats">
                <span id="wds-total-size" class="wds-badge">Total: 0 B</span>
                <span id="wds-item-count" class="wds-badge">0 items</span>
                <div class="dropdown" id="wds-export-dropdown">
                    <button id="wds-export-btn" class="wds-btn wds-btn-export" title="Export scan report">
                        <span>📥 Export</span> <span class="caret">▾</span>
                    </button>
                    <div class="dropdown-menu" id="wds-export-menu">
                        <button type="button" class="dropdown-item" id="export-html-btn">
                            <span class="item-icon">📄</span>
                            <div class="item-text">
                                <div class="item-title">HTML Summary</div>
                                <div class="item-desc">Standalone audit report (.html)</div>
                            </div>
                        </button>
                        <button type="button" class="dropdown-item" id="export-tree-btn">
                            <span class="item-icon">🌳</span>
                            <div class="item-text">
                                <div class="item-title">HTML Full Tree</div>
                                <div class="item-desc">Interactive ASCII Tree (.html)</div>
                            </div>
                        </button>
                    </div>
                </div>
                <button id="wds-close-btn" class="wds-btn wds-btn-close" title="Return to live rain view">✖ Rain View</button>
            </div>
        </header>

        <!-- Main Split Workspace -->
        <div class="wds-workspace">
            <!-- Top Section: Table List & Extension Legend -->
            <div class="wds-top-section">
                <!-- Directory / File Table -->
                <div class="wds-table-pane">
                    <div class="pane-header">
                        <span>Directory Contents</span>
                        <span id="wds-dir-count" class="subtle-count"></span>
                    </div>
                    <div class="table-scroll-wrapper">
                        <table class="wds-table">
                            <thead>
                                <tr>
                                    <th style="width: 42%;">Name</th>
                                    <th style="width: 28%;">Proportion</th>
                                    <th style="width: 18%;">Size</th>
                                    <th style="width: 12%;">Type</th>
                                </tr>
                            </thead>
                            <tbody id="wds-table-body">
                                <!-- Populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Extension Breakdown Legend -->
                <div class="wds-ext-pane">
                    <div class="pane-header">
                        <span>Extension Legend</span>
                        <span class="subtle-count">Color Coded</span>
                    </div>
                    <div id="wds-ext-list" class="ext-scroll-wrapper">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>

            <!-- Bottom Section: ECharts Treemap Cushion -->
            <div class="wds-bottom-section">
                <div class="pane-header treemap-header">
                    <span>Interactive Cushion Treemap</span>
                    <span class="subtle-count">Click folder to drill down</span>
                </div>
                <div id="wds-chart-wrapper" class="wds-chart-wrapper">
                    <div id="wds-chart" style="width: 100%; height: 100%;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="./assets/echarts.min.js"></script>
    <script src="./main.js"></script>
</body>
</html>
